# 单核 / 1G 内存服务器的运行配置。
# 推荐用法（1G 机器别在本机构建）：开发机/CI 构建并推镜像，服务器 compose 只 pull 运行。
#   本机测试：docker compose up --build
#   服务器：把下面 image 换成你推到仓库的镜像，注释掉 build，再 docker compose up -d
services:
  halfhalf:
    image: halfhalf:latest
    build: .                    # 服务器上部署时删掉这行，改用已推送的镜像
    ports:
      # 默认只绑回环地址，让同机 Caddy 反代提供 HTTPS——未加 HTTPS 就绑 0.0.0.0 等于把
      # 用户材料和 BYOK key 明文晾在公网上。确认要直接暴露时设 HALFHALF_BIND_ADDRESS=0.0.0.0。
      - "${HALFHALF_BIND_ADDRESS:-127.0.0.1}:80:3000"
    environment:
      HALFHALF_MAX_PAGES: "1"
      HALFHALF_CHROMIUM_NO_SANDBOX: "1"
      HALFHALF_PYTHON: "/usr/bin/python3"
      # 1G 机器上导入并发保持 1：一次 PDF 保真会同时吃 Chromium 和 PyMuPDF
      HALFHALF_IMPORT_CONCURRENCY: "1"
      HALFHALF_IMPORT_OWNER_LIMIT: "3"
      HALFHALF_IMPORT_HISTORY_LIMIT: "20"
      HALFHALF_IMPORT_JOB_TTL_MS: "604800000"   # 7 天后清掉终态任务及其结果文件
      HALFHALF_DATA_DIR: "/app/data"
      # 口令与 AI key 这类秘密放 .env（同目录，git 忽略；模板见 .env.example）
      # 口令缺失时 compose 直接拒绝启动——没有它这就是一个开放 API，任何人都能烧你的 key。
      HALFHALF_ACCESS_CODE: "${HALFHALF_ACCESS_CODE:?请先在 .env 设置 HALFHALF_ACCESS_CODE}"
      HALFHALF_AI_ENDPOINT: "${HALFHALF_AI_ENDPOINT:-}"
      HALFHALF_AI_MODEL: "${HALFHALF_AI_MODEL:-}"
      HALFHALF_AI_KEY: "${HALFHALF_AI_KEY:-}"
    mem_limit: 900m             # 给系统留余量，别让容器吃满 1G
    memswap_limit: 2g           # 允许用到 swap，吸收单次渲染的内存尖峰（务必先在宿主建 swap）
    volumes:
      # 任务历史与已完成结果；不挂这个卷则容器重建后历史清零（功能仍正常）
      - halfhalf-data:/app/data
    restart: unless-stopped

volumes:
  halfhalf-data:
